<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fichas educativas para pacientes</title>

<!--
  ============================================================
  FICHAS EDUCATIVAS PARA PACIENTES — GINECOLOGÍA/OBSTETRICIA
  ============================================================
  Archivo único (HTML + CSS + JS). No requiere servidor ni
  conexión a internet. Se puede abrir directo en el navegador,
  mandar por WhatsApp/email, o subir a cualquier hosting simple.

  ESTRUCTURA DE NAVEGACIÓN (3 pantallas):
    1. Categorías  -> Ginecología / Obstetricia
    2. Lista       -> fichas dentro de la categoría elegida
    3. Ficha       -> detalle de un procedimiento

  ESTRUCTURA DEL ARCHIVO:
    1. <style>   -> Diseño visual (colores, tipografía, layout)
    2. <body>    -> Esqueleto vacío (todo el contenido se
                    genera con JavaScript a partir de los datos)
    3. <script>  -> a) DATOS de cada ficha (fácil de encontrar
                       y editar, todo junto al inicio del script)
                    b) Funciones que dibujan la app en pantalla
                    c) Funciones de interacción y navegación

  PARA EDITAR CONTENIDO:
    Busca el bloque "DATOS DE LAS FICHAS" más abajo. Cada ficha
    es un objeto con textos simples. No hace falta tocar el CSS
    ni las funciones para cambiar una palabra o agregar un punto
    a una lista. Todo el texto está pensado en lenguaje simple,
    sin tecnicismos, porque lo lee la paciente.

  NOTA SOBRE EL MEDIDOR DE MOLESTIA:
    Solo aparece en fichas de Ginecología (tienen el campo
    "molestia"). Las fichas de Obstetricia no lo incluyen a
    propósito — el campo "molestia" simplemente se omite y el
    programa no lo dibuja (ver función renderFicha).
  ============================================================
-->

<style>
  /* ==========================================================
     TOKENS DE DISEÑO
     ========================================================== */
  :root {
    --bg:            #FBF8F6;
    --surface:       #FFFFFF;
    --ink:           #2E2530;
    --ink-soft:      #6B5F6E;
    --primary:       #4A3B52;
    --accent:        #E8927C;
    --accent-soft:   #F6DCD3;
    --calm:          #8FA998;
    --calm-soft:     #E4ECE4;
    --alert:         #C97A62;
    --alert-soft:    #FBEAE4;
    --line:          #E7DFDB;
    --amber:         #E3B24A;
    --obst:          #7C93B0; /* azul grisáceo suave — identidad de Obstetricia */
    --obst-soft:     #E7ECF2;
    --radius:        18px;
    --radius-sm:     10px;
    --shadow:        0 4px 20px rgba(74, 59, 82, 0.08);
  }

  @import url('https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap');

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font-family: 'Inter', system-ui, sans-serif;
    line-height: 1.55;
    -webkit-font-smoothing: antialiased;
  }

  h1, h2, h3 { font-family: 'Fraunces', serif; margin: 0; }

  .mono { font-family: 'IBM Plex Mono', monospace; letter-spacing: 0.02em; }

  #app {
    max-width: 720px;
    margin: 0 auto;
    padding: 32px 20px 80px;
  }

  header.app-header { text-align: center; margin-bottom: 32px; }
  header.app-header h1 { font-size: clamp(26px, 5vw, 34px); font-weight: 600; color: var(--primary); }
  header.app-header p  { color: var(--ink-soft); font-size: 15px; margin-top: 8px; }

  /* ---------- Pantalla 1: Categorías ---------- */
  #categorias {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px;
  }
  @media (max-width: 480px) { #categorias { grid-template-columns: 1fr; } }

  .categoria-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 30px 20px;
    text-align: center;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .categoria-card:hover, .categoria-card:focus-visible { transform: translateY(-3px); outline: none; }
  .categoria-card.ginecologia:hover { border-color: var(--accent); }
  .categoria-card.obstetricia:hover { border-color: var(--obst); }
  .categoria-card svg { width: 56px; height: 56px; margin-bottom: 12px; }
  .categoria-card h3 { font-size: 19px; color: var(--primary); margin-bottom: 4px; }
  .categoria-card p { font-size: 13px; color: var(--ink-soft); margin: 0; }
  .categoria-card .cuenta {
    display: inline-block;
    margin-top: 10px;
    font-size: 12px;
    padding: 3px 10px;
    border-radius: 20px;
    background: var(--bg);
    color: var(--ink-soft);
  }

  /* ---------- Pantalla 2: Lista de fichas dentro de una categoría ---------- */
  #lista-fichas { display: none; }

  #lista-fichas .lista-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 20px;
  }
  #lista-fichas .lista-header svg { width: 36px; height: 36px; }
  #lista-fichas .lista-header h2 { font-size: 21px; color: var(--primary); }

  #lista-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
    gap: 12px;
  }

  .selector-card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 20px 14px;
    text-align: center;
    cursor: pointer;
    box-shadow: var(--shadow);
    transition: transform 0.15s ease, border-color 0.15s ease;
  }
  .selector-card:hover, .selector-card:focus-visible { transform: translateY(-3px); border-color: var(--accent); outline: none; }
  .selector-card svg { width: 40px; height: 40px; margin-bottom: 8px; }
  .selector-card h3 { font-size: 15px; color: var(--primary); }
  .selector-card p  { font-size: 12px; color: var(--ink-soft); margin: 4px 0 0; }

  /* ---------- Pantalla 3: Ficha individual ---------- */
  #ficha-view { display: none; }

  .btn-volver {
    background: none;
    border: none;
    color: var(--ink-soft);
    font-family: 'Inter', sans-serif;
    font-size: 14px;
    cursor: pointer;
    padding: 8px 0;
    margin-bottom: 12px;
    display: inline-flex;
    align-items: center;
    gap: 6px;
  }
  .btn-volver:hover { color: var(--primary); }

  .ficha-header {
    display: flex;
    align-items: center;
    gap: 14px;
    margin-bottom: 22px;
  }
  .ficha-header svg { width: 44px; height: 44px; flex-shrink: 0; }
  .ficha-header h2 { font-size: 24px; color: var(--primary); }
  .ficha-header span { font-size: 13px; color: var(--ink-soft); }

  /* ---------- Medidor de molestia (solo Ginecología) ---------- */
  .medidor {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 18px;
    box-shadow: var(--shadow);
  }
  .medidor-title {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--ink-soft);
    margin-bottom: 10px;
  }
  .medidor-regla { display: flex; gap: 6px; margin-bottom: 8px; }
  .medidor-segmento {
    flex: 1;
    height: 12px;
    border-radius: 4px;
    border: 2px solid var(--line);
    background: var(--surface);
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .medidor-label { font-size: 14px; font-weight: 500; color: var(--primary); }
  .medidor-nivel { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  .medidor-nivel b { color: var(--primary); }

  /* ---------- Acordeón ---------- */
  .accordion-item {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--radius);
    margin-bottom: 12px;
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .accordion-btn {
    width: 100%;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    background: none;
    border: none;
    padding: 16px 18px;
    font-family: 'Fraunces', serif;
    font-size: 16px;
    font-weight: 600;
    color: var(--primary);
    cursor: pointer;
    text-align: left;
  }
  .accordion-chevron { flex-shrink: 0; transition: transform 0.2s ease; color: var(--accent); }
  .accordion-item.open .accordion-chevron { transform: rotate(180deg); }

  .accordion-panel { max-height: 0; overflow: hidden; transition: max-height 0.25s ease; }
  .accordion-panel-inner { padding: 0 18px 18px; font-size: 15px; color: var(--ink); }
  .accordion-panel-inner ul { margin: 6px 0; padding-left: 20px; }
  .accordion-panel-inner li { margin-bottom: 4px; }

  /* ---------- Checklist interactivo ---------- */
  .checklist-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 10px;
    border-radius: var(--radius-sm);
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .checklist-item:hover { background: var(--calm-soft); }
  .checklist-box {
    width: 20px; height: 20px;
    border: 2px solid var(--calm);
    border-radius: 5px;
    flex-shrink: 0;
    margin-top: 2px;
    display: flex; align-items: center; justify-content: center;
    transition: background 0.15s ease;
  }
  .checklist-item.checked .checklist-box {
    background: var(--calm);
    border-color: var(--calm);
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
  .checklist-item.checked .checklist-box::after {
    content: "✓";
    color: var(--surface);
    font-size: 13px;
    font-weight: 700;
    line-height: 1;
  }

  /* ---------- Comparador de tipos (DIU) ---------- */
  .comparador { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 6px 0 4px; }
  @media (max-width: 480px) { .comparador { grid-template-columns: 1fr; } }
  .comparador-card { border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 14px; background: var(--bg); }
  .comparador-card h4 { font-family: 'Fraunces', serif; font-size: 15px; color: var(--primary); margin-bottom: 8px; }
  .comparador-row { display: flex; justify-content: space-between; font-size: 13px; padding: 5px 0; border-top: 1px dashed var(--line); }
  .comparador-row:first-of-type { border-top: none; }
  .comparador-row b { color: var(--ink-soft); font-weight: 500; }

  /* ---------- Cajas normal / alerta ---------- */
  .caja-alerta { background: var(--alert-soft); border-left: 4px solid var(--alert); border-radius: var(--radius-sm); padding: 12px 14px; font-size: 14px; margin-top: 8px; }
  .caja-alerta b { color: var(--alert); }
  .caja-normal { background: var(--calm-soft); border-left: 4px solid var(--calm); border-radius: var(--radius-sm); padding: 12px 14px; font-size: 14px; margin-top: 8px; }
  .caja-normal b { color: var(--primary); }

  /* ---------- Mitos ---------- */
  .mito { padding: 10px 0; border-top: 1px dashed var(--line); font-size: 14px; }
  .mito:first-of-type { border-top: none; }
  .mito .etiqueta-mito { color: var(--alert); font-weight: 600; }
  .mito .etiqueta-real { color: var(--calm); font-weight: 600; }

  /* ---------- Acciones al pie ---------- */
  .acciones { display: flex; gap: 10px; margin-top: 20px; }
  .btn-accion {
    flex: 1; padding: 12px; border-radius: var(--radius-sm);
    border: 1px solid var(--line); background: var(--surface);
    color: var(--primary); font-family: 'Inter', sans-serif;
    font-size: 14px; font-weight: 500; cursor: pointer;
  }
  .btn-accion.primario { background: var(--primary); color: var(--surface); border-color: var(--primary); }

  @media print {
    .btn-volver, .acciones { display: none !important; }
    .accordion-panel { max-height: none !important; }

    /* Márgenes de página más generosos y sin el "salto raro"
       que deja un espacio grande en blanco al cortar una
       sección justo por la mitad. */
    @page { margin: 1.6cm; }

    /* Fuerza a imprimir TODOS los colores de fondo (cajas
       normal/alerta, chevrones, medidor) — por defecto el
       navegador los omite en la vista de impresión/PDF. */
    * {
      -webkit-print-color-adjust: exact !important;
      print-color-adjust: exact !important;
    }

    /* Evita que una sección se corte a la mitad entre dos
       páginas — si no cabe completa, el navegador la empieza
       de página nueva, en vez de partirla dejando un hueco. */
    .accordion-item,
    .caja-normal,
    .caja-alerta,
    .medidor,
    .comparador-card,
    .ficha-header,
    .mito {
      break-inside: avoid;
      page-break-inside: avoid;
    }

    /* Reduce sombras (no aportan nada en papel/PDF y a veces
       el navegador las renderiza como un borde gris feo). */
    .accordion-item, .medidor, .comparador-card { box-shadow: none; }
  }

  button:focus-visible, .checklist-item:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>

<div id="app">
  <header class="app-header">
    <h1>Antes de tu procedimiento</h1>
    <p>Guías sencillas para saber qué esperar. Elige la sección y luego el procedimiento indicado por tu médico.</p>
  </header>

  <!-- Pantalla 1: categorías -->
  <div id="categorias"></div>

  <!-- Pantalla 2: lista de fichas de una categoría -->
  <div id="lista-fichas">
    <div class="lista-header" id="lista-header"></div>
    <button class="btn-volver" onclick="volverACategorias()" style="margin-bottom:16px;"></button>
    <div id="lista-grid"></div>
  </div>

  <!-- Pantalla 3: ficha individual -->
  <div id="ficha-view"></div>
</div>

<script>
/* ============================================================
   1. DATOS DE LAS CATEGORÍAS
   ============================================================ */
  const CATEGORIAS = {
    ginecologia: {
      id: 'ginecologia',
      nombre: 'Ginecología',
      subtitulo: 'Revisiones y procedimientos ginecológicos',
      icono: () => iconoCategoriaGineco(),
      claseCss: 'ginecologia'
    },
    obstetricia: {
      id: 'obstetricia',
      nombre: 'Obstetricia',
      subtitulo: 'Control del embarazo y parto',
      icono: () => iconoCategoriaObste(),
      claseCss: 'obstetricia'
    }
  };

/* ============================================================
   2. DATOS DE LAS FICHAS
   ------------------------------------------------------------
   Cada ficha pertenece a una categoria: 'ginecologia' u
   'obstetricia'. El campo "molestia" es OPCIONAL — si no está
   presente, el medidor simplemente no se dibuja (así excluimos
   el medidor de todas las fichas de Obstetricia).
   ============================================================ */
  const FICHAS = {

    /* ---------------------- GINECOLOGÍA ---------------------- */

    papanicolau: {
      id: 'papanicolau', categoria: 'ginecologia',
      nombre: 'Papanicolau', subtitulo: 'Citología cervical',
      icono: iconoPap,
      molestia: { nivel: 1, texto: 'Leve — un pellizco breve, dura segundos' },
      duracion: 'Entre 3 y 5 minutos',
      queEs: 'Es una prueba de rutina para detectar cambios en las células del cuello del útero, antes de que se conviertan en un problema. Se toma una pequeña muestra con un cepillo suave, no es una cirugía ni requiere anestesia.',
      preparacion: [
        'Evita relaciones sexuales 48 horas antes',
        'No uses óvulos, cremas vaginales ni duchas 48 horas antes',
        'Evita programarlo si estás con tu período (a menos que tu médico indique lo contrario)',
        'Vejiga vacía antes del examen (orina antes de entrar)'
      ],
      queEsperar: 'Te recuestas en la camilla, el médico coloca un espéculo (instrumento que separa suavemente las paredes vaginales para ver el cuello del útero) y toma la muestra con un cepillo. Puede sentirse presión o un pellizco corto, no debería doler.',
      normal: 'Un manchado leve o sensación de "cólico" muy suave por unas horas es normal.',
      alarma: 'Si tienes sangrado abundante, dolor fuerte o fiebre en los días siguientes, consulta.',
      mitos: [
        { mito: 'Solo se hace si ya tuviste relaciones sexuales.', real: 'Se recomienda a partir de cierta edad o inicio de vida sexual — tu médico te indica cuándo empezar.' },
        { mito: 'Un resultado anormal significa cáncer.', real: 'La mayoría de las veces son cambios leves y tratables; el resultado guía el siguiente paso, no es un diagnóstico final.' }
      ]
    },

    colposcopia: {
      id: 'colposcopia', categoria: 'ginecologia',
      nombre: 'Colposcopia', subtitulo: 'Revisión ampliada del cuello uterino',
      icono: iconoColpo,
      molestia: { nivel: 2, texto: 'Leve a moderada — similar al Papanicolau, un poco más larga' },
      duracion: 'Entre 10 y 15 minutos',
      queEs: 'Es un examen más detallado del cuello del útero, usando un instrumento con aumento (como una lupa especial) para ver de cerca zonas que el Papanicolau marcó como alteradas. Se indica para revisar más de cerca, no significa que ya haya un diagnóstico grave.',
      preparacion: [
        'Evita relaciones sexuales 48 horas antes',
        'No uses óvulos ni cremas vaginales 48 horas antes',
        'Puedes tomar un analgésico común antes, si tu médico lo indica',
        'Idealmente, no programarlo durante tu período'
      ],
      queEsperar: 'Similar a un Papanicolau: te recuestas en la camilla y se usa un espéculo. El médico aplica un líquido especial (puede arder un poco) que ayuda a resaltar las zonas a observar, y a veces toma una biopsia (una muestra muy pequeña de tejido) si es necesario.',
      normal: 'Si se tomó biopsia, es normal un manchado oscuro o sangrado leve por varios días.',
      alarma: 'Sangrado abundante (más que un período normal), dolor intenso o fiebre — consulta de inmediato.',
      mitos: [
        { mito: 'Si me hacen colposcopia, tengo cáncer.', real: 'Se indica para revisar más de cerca un resultado alterado; en la mayoría de los casos son cambios menores.' },
        { mito: 'Duele igual que una cirugía.', real: 'La molestia es similar o apenas mayor a un Papanicolau; no requiere anestesia general.' }
      ]
    },

    diu: {
      id: 'diu', categoria: 'ginecologia',
      nombre: 'DIU', subtitulo: 'Colocación del dispositivo intrauterino',
      icono: iconoDIU,
      molestia: { nivel: 3, texto: 'Moderada durante la colocación — tipo cólico, breve' },
      duracion: 'La colocación toma entre 5 y 10 minutos',
      queEs: 'Es un método anticonceptivo de larga duración. Es un pequeño dispositivo en forma de "T" que se coloca dentro del útero y previene el embarazo de forma continua, sin que tengas que acordarte de tomarlo a diario.',
      tipos: [
        { nombre: 'DIU de cobre', duracion: 'Hasta 10 años', hormonas: 'No contiene', sangrado: 'Puede aumentar un poco el sangrado menstrual' },
        { nombre: 'DIU hormonal', duracion: '3 a 8 años (según modelo)', hormonas: 'Libera levonorgestrel', sangrado: 'Suele reducir el sangrado con el tiempo' }
      ],
      preparacion: [
        'Idealmente se coloca durante o justo después del período menstrual',
        'Puedes tomar un analgésico común antes, si tu médico lo indica',
        'No es necesario venir en ayunas',
        'Es normal sentir nervios — puedes comentarlo con tu médico antes de empezar'
      ],
      queEsperar: 'Se hace en el consultorio, no requiere cirugía. Se coloca un espéculo, se mide el útero y se inserta el DIU con un aplicador delgado. Se puede sentir un cólico fuerte pero breve durante la colocación.',
      normal: 'Cólicos leves y manchado los primeros días, incluso hasta las primeras semanas, son normales mientras el cuerpo se adapta.',
      alarma: 'Dolor intenso que no mejora, fiebre, sangrado muy abundante, o si no sientes los hilos del DIU — consulta a tu médico.',
      mitos: [
        { mito: 'El DIU se puede perder dentro del cuerpo.', real: 'No puede viajar a otras partes del cuerpo; en casos raros puede moverse de posición, por eso se revisa en controles.' },
        { mito: 'No sirve para quien no ha tenido hijos.', real: 'Puede usarse también en mujeres que no han sido madres; tu médico evalúa si es la mejor opción para ti.' },
        { mito: 'Se siente durante las relaciones sexuales.', real: 'Normalmente ni tú ni tu pareja lo sienten; si ocurre, conviene revisar la posición con tu médico.' }
      ]
    },

    extraccionDIU: {
      id: 'extraccionDIU', categoria: 'ginecologia',
      nombre: 'Extracción del DIU', subtitulo: 'Retiro del dispositivo intrauterino',
      icono: iconoDIU,
      molestia: { nivel: 2, texto: 'Leve a moderada — un cólico breve al momento de retirarlo' },
      duracion: 'Entre 2 y 5 minutos',
      queEs: 'Es el procedimiento para sacar el DIU cuando ya cumplió su tiempo de uso, cuando quieres buscar un embarazo, o si decides cambiar de método anticonceptivo.',
      preparacion: [
        'No es necesaria ninguna preparación especial',
        'Puedes tomar un analgésico común antes, si sientes que te ayuda',
        'Coméntale a tu médico si buscas embarazo pronto, para planificar el momento'
      ],
      queEsperar: 'Se coloca un espéculo y el médico jala suavemente los hilos del DIU para retirarlo. Suele sentirse un cólico breve, parecido al de la colocación pero más corto.',
      normal: 'Un cólico leve y un poco de manchado por el resto del día son normales.',
      alarma: 'Dolor intenso, sangrado abundante o fiebre en los días siguientes — consulta a tu médico.',
      mitos: [
        { mito: 'Si me lo quito, no puedo quedar embarazada de inmediato.', real: 'La fertilidad suele regresar rápido después de retirar el DIU, tanto de cobre como hormonal.' }
      ]
    },

    ecoTransvaginal: {
      id: 'ecoTransvaginal', categoria: 'ginecologia',
      nombre: 'Ecografía transvaginal', subtitulo: 'Ecografía ginecológica interna',
      icono: iconoLupa,
      molestia: { nivel: 1, texto: 'Leve — sensación de presión, no debería doler' },
      duracion: 'Entre 5 y 10 minutos',
      queEs: 'Es una ecografía que se hace con un transductor delgado (un instrumento con forma de varita, cubierto con un preservativo o funda) que se introduce en la vagina. Permite ver el útero y los ovarios con mucha más claridad que una ecografía por fuera del abdomen.',
      preparacion: [
        'Normalmente NO necesitas vejiga llena (a diferencia de la ecografía abdominal)',
        'Puedes ir al baño antes del examen',

  const iconoVolver = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  const iconoChevron = `<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M6 9l6 6 6-6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;

  /* ============================================================
     4. RENDER — construye el HTML a partir de los datos
     ============================================================ */

  // --- 4.1 Pantalla de categorías ---
  function renderCategorias() {
    const cont = document.getElementById('categorias');
    cont.innerHTML = Object.values(CATEGORIAS).map(c => {
      const total = Object.values(FICHAS).filter(f => f.categoria === c.id).length;
      return `
        <div class="categoria-card ${c.claseCss}" tabindex="0" role="button" onclick="abrirCategoria('${c.id}')" onkeypress="if(event.key==='Enter') abrirCategoria('${c.id}')">
          ${c.icono()}
          <h3>${c.nombre}</h3>
          <p>${c.subtitulo}</p>
          <span class="cuenta">${total} fichas</span>
        </div>
      `;
    }).join('');
  }

  // --- 4.2 Lista de fichas dentro de una categoría ---
  let categoriaActual = null;
  function renderListaFichas(catId) {
    const cat = CATEGORIAS[catId];
    document.getElementById('lista-header').innerHTML = `${cat.icono()}<h2>${cat.nombre}</h2>`;
    const grid = document.getElementById('lista-grid');
    const fichasDeCategoria = Object.values(FICHAS).filter(f => f.categoria === catId);
    grid.innerHTML = fichasDeCategoria.map(f => `
      <div class="selector-card" tabindex="0" role="button" onclick="abrirFicha('${f.id}')" onkeypress="if(event.key==='Enter') abrirFicha('${f.id}')">
        ${f.icono()}
        <h3>${f.nombre}</h3>
        <p>${f.subtitulo}</p>
      </div>
    `).join('');
  }

  // --- 4.3 Medidor de molestia (solo si la ficha lo trae) ---
  const COLORES_MOLESTIA = ['var(--calm)', 'var(--amber)', 'var(--accent)', 'var(--alert)'];
  function renderMedidor(m) {
    const segmentos = [0, 1, 2, 3].map(i => {
      const activo = i < m.nivel;
      const color = activo ? COLORES_MOLESTIA[i] : 'var(--surface)';
      return `<div class="medidor-segmento" style="background:${color}; border-color:${activo ? COLORES_MOLESTIA[i] : 'var(--line)'}"></div>`;
    }).join('');
    return `
      <div class="medidor">
        <div class="medidor-title">Nivel de molestia esperado</div>
        <div class="medidor-regla">${segmentos}</div>
        <div class="medidor-label">${m.texto}</div>
        <div class="medidor-nivel">Nivel <b>${m.nivel} de 4</b></div>
      </div>
    `;
  }

  // --- 4.4 Checklist de preparación ---
  function renderChecklist(items) {
    return `<div class="checklist">` + items.map((txt) => `
      <div class="checklist-item" tabindex="0" onclick="toggleCheck(this)" onkeypress="if(event.key==='Enter') toggleCheck(this)">
        <div class="checklist-box"></div>
        <span class="txt">${txt}</span>
      </div>
    `).join('') + `</div>`;
  }
  function toggleCheck(el) { el.classList.toggle('checked'); }

  // --- 4.5 Comparador de tipos (usado en DIU) ---
  function renderComparador(tipos) {
    return `<div class="comparador">` + tipos.map(t => `
      <div class="comparador-card">
        <h4>${t.nombre}</h4>
        <div class="comparador-row"><b>Duración</b><span>${t.duracion}</span></div>
        <div class="comparador-row"><b>Hormonas</b><span>${t.hormonas}</span></div>
        <div class="comparador-row"><b>Sangrado</b><span>${t.sangrado}</span></div>
      </div>
    `).join('') + `</div>`;
  }

  // --- 4.6 Lista de mitos ---
  function renderMitos(mitos) {
    return mitos.map(m => `
      <div class="mito">
        <div><span class="etiqueta-mito">Mito:</span> ${m.mito}</div>
        <div><span class="etiqueta-real">Real:</span> ${m.real}</div>
      </div>
    `).join('');
  }

  // --- 4.7 Ítem de acordeón genérico ---
  function accordionItem(titulo, contenidoHTML, abiertoPorDefecto = false) {
    return `
      <div class="accordion-item ${abiertoPorDefecto ? 'open' : ''}">
        <button class="accordion-btn" onclick="toggleAccordion(this)">
          <span>${titulo}</span>
          <span class="accordion-chevron">${iconoChevron}</span>
        </button>
        <div class="accordion-panel" style="${abiertoPorDefecto ? 'max-height:1000px' : ''}">
          <div class="accordion-panel-inner">${contenidoHTML}</div>
        </div>
      </div>
    `;
  }
  function toggleAccordion(btn) {
    const item = btn.closest('.accordion-item');
    const panel = item.querySelector('.accordion-panel');
    const abrir = !item.classList.contains('open');
    item.classList.toggle('open', abrir);
    panel.style.maxHeight = abrir ? panel.scrollHeight + 'px' : '0px';
  }

  // --- 4.8 Vista completa de una ficha ---
  function renderFicha(f) {
    let secciones = '';

    secciones += accordionItem('¿Qué es?', `<p>${f.queEs}</p>`, true);

    if (f.preparacion) {
      secciones += accordionItem('¿Cómo me preparo?', renderChecklist(f.preparacion));
    }

    if (f.tipos) {
      secciones += accordionItem('Tipos disponibles', renderComparador(f.tipos));
    }

    secciones += accordionItem('¿Qué voy a sentir?', `<p>${f.queEsperar}</p>`);

    secciones += accordionItem('Después del procedimiento', `
      <div class="caja-normal"><b>Es normal:</b> ${f.normal}</div>
      <div class="caja-alerta"><b>Consulta si:</b> ${f.alarma}</div>
    `);

    if (f.mitos && f.mitos.length) {
      secciones += accordionItem('Mitos comunes', renderMitos(f.mitos));
    }

    // El medidor de molestia SOLO se dibuja si la ficha trae el
    // campo "molestia" (todas las de Ginecología lo traen, las
    // de Obstetricia lo omiten a propósito).
    const medidorHTML = f.molestia ? renderMedidor(f.molestia) : '';

    return `
      <button class="btn-volver" onclick="volverALista()">${iconoVolver} Volver</button>
      <div class="ficha-header">
        ${f.icono()}
        <div>
          <h2>${f.nombre}</h2>
          <span class="mono">${f.subtitulo} · ${f.duracion}</span>
        </div>
      </div>
      ${medidorHTML}
      ${secciones}
      <div class="acciones">
        <button class="btn-accion" onclick="window.print()">Imprimir / Guardar como PDF</button>
        <button class="btn-accion primario" onclick="volverALista()">Ver otra ficha</button>
      </div>
    `;
  }

  /* ============================================================
     5. NAVEGACIÓN entre las 3 pantallas
     ============================================================ */
  function mostrarSolo(id) {
    ['categorias', 'lista-fichas', 'ficha-view'].forEach(otherId => {
      document.getElementById(otherId).style.display = (otherId === id)
        ? (id === 'categorias' ? 'grid' : 'block')
        : 'none';
    });
    window.scrollTo(0, 0);
  }

  function abrirCategoria(catId) {
    categoriaActual = catId;
    renderListaFichas(catId);
    mostrarSolo('lista-fichas');
  }

  function abrirFicha(id) {
    const f = FICHAS[id];
    categoriaActual = f.categoria;
    document.getElementById('ficha-view').innerHTML = renderFicha(f);
    mostrarSolo('ficha-view');
  }

  function volverALista() {
    renderListaFichas(categoriaActual);
    mostrarSolo('lista-fichas');
  }

  function volverACategorias() {
    mostrarSolo('categorias');
  }

  /* ============================================================
     6. INICIO
     ============================================================ */
  // Texto del botón "volver" fijo dentro de la lista de fichas
  document.getElementById('lista-fichas').querySelector('.btn-volver').innerHTML = iconoVolver + ' Volver a categorías';
  renderCategorias();
</script>
